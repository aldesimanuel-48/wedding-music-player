
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Music Aldes</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#3b2430,#a77b73);
  font-family: Georgia,serif;
  color: white;
  text-align: center;
}

.player {
  padding: 30px;
}

img {
  width: 230px;
  height: 230px;
  object-fit: cover;
  border-radius: 20px;
  box-shadow: 0 5px 20px #0008;
}

button {
  padding: 14px 30px;
  border: 0;
  border-radius: 30px;
  background: #f4d5b5;
  font-size: 17px;
  cursor: pointer;
}

/* ANIMASI ROMANTIS ALDES & VINA */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-romantic {
  animation: fadeInUp 1.8s ease-out both;
}

.animate-slow {
  animation: fadeInUp 2.5s ease-out both;
}
</style>
</head>

<body>
<div class="player">

<img src="judul.jpg" alt="Wedding">

<h2 class="animate-romantic">Wedding Music</h2>

<p class="animate-romantic" style="animation-delay: 0.7s;">
  Aldes & Vina
</p>

<audio id="musik" src="lagu..mp3" loop></audio>

<button onclick="document.getElementById('musik').play()">
  ▶ PLAY MUSIC
</button>

<p class="animate-slow" style="animation-delay: 1.5s;">
  With Love ❤️
</p>

</div>
</body>
</html>
